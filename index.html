<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Таблички на двері — редактор</title>
<meta name="description" content="Редактор табличок на двері кабінетів: список, категорії, кольори, емблема. Друк у PDF без полів.">
<style>
  :root{
    --ink:#16181B; --muted:#6E757E; --line:#DCDFE4;
    --bg:#EFF0F2; --card:#fff; --accent:#2E6D9C;
    --panel-w:92mm; --num-color:#2E6D9C;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.45 "Inter","Segoe UI",system-ui,-apple-system,Arial,sans-serif}
  button,input,select{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .app{display:grid;grid-template-columns:340px 1fr;min-height:100vh}
  @media (max-width:900px){.app{grid-template-columns:1fr}}

  /* ---------- панель керування ---------- */
  .panel{background:var(--card);border-right:1px solid var(--line);
         padding:20px 18px 40px;overflow:auto;max-height:100vh}
  @media (max-width:900px){.panel{max-height:none;border-right:0;border-bottom:1px solid var(--line)}}
  .panel h1{font-size:17px;margin:0 0 2px;letter-spacing:-.01em}
  .panel .sub{color:var(--muted);font-size:13px;margin:0 0 20px}
  fieldset{border:0;border-top:1px solid var(--line);margin:0 0 18px;padding:16px 0 0}
  legend{padding:0;font-size:12.5px;color:var(--muted)}
  label{display:block;font-size:13px;margin:10px 0 5px;color:var(--muted)}
  input[type=text],select{width:100%;padding:7px 9px;border:1px solid var(--line);
       border-radius:6px;background:#fff}
  input[type=range]{width:100%;accent-color:var(--accent)}
  input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--line);
       border-radius:5px;background:none;cursor:pointer}
  .btn{border:1px solid var(--line);background:#fff;border-radius:7px;
       padding:8px 12px;cursor:pointer}
  .btn:hover{border-color:#B9BEC6}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;width:100%;
       padding:11px;font-weight:600}
  .btn.primary:hover{background:#255C85}
  .btn.ghost{color:var(--muted);padding:6px 10px;font-size:13px}

  .rows{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .row{display:grid;grid-template-columns:52px 1fr 96px 26px;gap:5px;align-items:center}
  .row input,.row select{padding:6px 7px;font-size:13px}
  .row .del{border:0;background:none;color:#B0B6BE;cursor:pointer;font-size:17px;line-height:1;padding:2px}
  .row .del:hover{color:#C0392B}
  .rowhead{display:grid;grid-template-columns:52px 1fr 96px 26px;gap:5px;
       font-size:11.5px;color:var(--muted);margin-top:12px}
  .cats{display:flex;flex-direction:column;gap:7px;margin-top:8px}
  .cat{display:flex;align-items:center;gap:9px;font-size:13.5px}
  .cat input[type=text]{flex:1;padding:5px 7px;font-size:13px}
  .hint{font-size:12.5px;color:var(--muted);margin:10px 0 0}
  .seg{display:flex;gap:6px;margin-top:8px}
  .seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:7px;
       padding:8px;cursor:pointer;font-size:13px}
  .seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}

  /* ---------- сцена з прев'ю ---------- */
  .stage{padding:26px 26px 60px;overflow:auto}
  .zoomwrap{position:relative}
  #sheets{transform-origin:top left}

  .sign{position:relative;width:297mm;height:105mm;background:#fff;overflow:hidden;
        margin-bottom:6mm;box-shadow:0 1px 3px rgba(0,0,0,.14)}
  .num{position:absolute;left:0;top:0;height:105mm;line-height:105mm;text-align:center;
       color:#fff;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
  .txt{position:absolute;top:0}
  .title{font-weight:700;line-height:1.18;letter-spacing:-.01em;overflow-wrap:break-word;word-wrap:break-word}
  .rule{width:26mm;height:.6mm;margin:6.5mm 0}
  .school{font-size:3mm;letter-spacing:.13em;color:#8A9099;text-transform:uppercase;white-space:nowrap}
  .logo{position:absolute;right:16mm;height:34mm;width:auto}

  .a4{width:210mm;height:297mm;background:#fff;position:relative;overflow:hidden;
      margin-bottom:6mm;box-shadow:0 1px 3px rgba(0,0,0,.14)}
  .a4 .slot{position:absolute;top:0;left:0;-webkit-transform-origin:top left;transform-origin:top left}
  .a4 .slot .sign{margin:0;box-shadow:none}
  .a4 .cut{position:absolute;top:0;bottom:0;width:0;border-left:.6px dashed #9AA0A6}

  @media print{
    body{background:#fff}
    .panel{display:none}
    .stage{padding:0;overflow:visible}
    #sheets{transform:none!important}
    .zoomwrap{height:auto!important}
    .sign,.a4{margin:0;box-shadow:none;break-after:page;page-break-after:always}
    .a4 .slot .sign{break-after:auto;page-break-after:auto}
    .sign,.a4,.num,.rule{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
<style id="pagecss">@page{size:297mm 105mm;margin:0}</style>

</head>
<body>
<div class="app">
  <aside class="panel">
    <h1>Таблички на двері</h1>
    <p class="sub">Редагуйте список, потім друкуйте у PDF.</p>

    <fieldset>
      <legend>Заклад</legend>
      <label for="school">Назва в підписі</label>
      <input type="text" id="school">
      <label style="margin-top:14px">Емблема</label>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn" id="logoBtn">Замінити файл</button>
        <button class="btn ghost" id="logoOff">Прибрати</button>
      </div>
      <input type="file" id="logoFile" accept="image/*" hidden>
      <label for="logoH" style="margin-top:12px">Розмір емблеми: <b id="logoHv">34</b> мм</label>
      <input type="range" id="logoH" min="18" max="46" step="1" value="34">
    </fieldset>

    <fieldset>
      <legend>Кабінети</legend>
      <div class="rowhead"><span>Номер</span><span>Назва</span><span>Категорія</span><span></span></div>
      <div class="rows" id="rows"></div>
      <button class="btn" id="add" style="margin-top:10px">Додати кабінет</button>
    </fieldset>

    <fieldset>
      <legend>Кольори категорій</legend>
      <div class="cats" id="cats"></div>
    </fieldset>

    <fieldset>
      <legend>Макет</legend>
      <label for="panelW">Ширина кольорового блоку: <b id="panelWv">92</b> мм</label>
      <input type="range" id="panelW" min="60" max="130" step="1" value="92">
      <label style="margin-top:14px">Розкладка для друку</label>
      <div class="seg">
        <button id="m1" aria-pressed="true">Одна на сторінку</button>
        <button id="m2" aria-pressed="false">Дві на A4</button>
      </div>
      <p class="hint" id="modeHint">Сторінка 297 × 105 мм. Потрібен друк без полів або друкарня.</p>
    </fieldset>

    <button class="btn primary" id="print">Друкувати / зберегти PDF</button>
    <p class="hint">У вікні друку виберіть «Зберегти як PDF», поля — «Немає», масштаб — 100 %, і увімкніть друк фонової графіки.</p>
    <button class="btn ghost" id="reset" style="margin-top:14px">Повернути початковий список</button>
  </aside>

  <main class="stage">
    <div class="zoomwrap"><div id="sheets"></div></div>
  </main>
</div>

  clearTimeout(saveT);
  saveT = setTimeout(function(){
    try { localStorage.setItem("door-signs", JSON.stringify(S)); } catch(e){}
  }, 400);
}

/* ---- елементи керування ---- */
const $ = id => document.getElementById(id);

function buildRows(){
  const box = $("rows"); box.innerHTML = "";
  S.rooms.forEach((r, i) => {
    const row = document.createElement("div"); row.className = "row";

    const num = document.createElement("input");
    num.type = "text"; num.value = r[0]; num.setAttribute("aria-label","Номер кабінету");
    num.oninput = () => { r[0] = num.value; render(); save(); };

    const name = document.createElement("input");
    name.type = "text"; name.value = r[1]; name.setAttribute("aria-label","Назва кабінету");
    name.oninput = () => { r[1] = name.value; render(); save(); };

    const cat = document.createElement("select");
    cat.setAttribute("aria-label","Категорія");
    S.cats.forEach(c => {
      const o = document.createElement("option");
      o.value = c.id; o.textContent = c.name; cat.appendChild(o);
    });
    cat.value = r[2];
    cat.onchange = () => { r[2] = cat.value; render(); save(); };

    const del = document.createElement("button");
    del.className = "del"; del.textContent = "×"; del.title = "Видалити рядок";
    del.onclick = () => { S.rooms.splice(i,1); buildRows(); render(); save(); };

    row.append(num, name, cat, del);
    box.appendChild(row);
  });
}

function buildCats(){
  const box = $("cats"); box.innerHTML = "";
  S.cats.forEach(c => {
    const wrap = document.createElement("div"); wrap.className = "cat";
    const col = document.createElement("input");
    col.type = "color"; col.value = c.color;
    col.setAttribute("aria-label","Колір категорії " + c.name);
    col.oninput = () => { c.color = col.value; render(); save(); };
    const nm = document.createElement("input");
    nm.type = "text"; nm.value = c.name;
    nm.setAttribute("aria-label","Назва категорії");
    nm.oninput = () => { c.name = nm.value; buildRows(); save(); };
    wrap.append(col, nm);
    box.appendChild(wrap);
  });
}

/* ---- побудова таблички ---- */
function colorOf(id){
  const c = S.cats.find(x => x.id === id);
  return c ? c.color : "#3A3F45";
}

function makeSign(room){
  var number = room[0], title = room[1], color = colorOf(room[2]);
  var logoW = S.logo ? S.logoH + 12 : 0;          // емблема + зазор, мм

  var sign = document.createElement("div"); sign.className = "sign";

  var num = document.createElement("div"); num.className = "num";
  num.style.background = color;
  num.style.width = S.panelW + "mm";
  var numIn = document.createElement("span");
  numIn.textContent = number;
  num.appendChild(numIn);
  num.style.fontSize = ((number || "").length <= 3 ? 38 : 30) + "mm";

  var txt = document.createElement("div"); txt.className = "txt";
  txt.style.left = (S.panelW + 16) + "mm";
  txt.style.width = (297 - S.panelW - 32 - logoW) + "mm";
  var t = document.createElement("div"); t.className = "title"; t.textContent = title;
  var rule = document.createElement("div"); rule.className = "rule"; rule.style.background = color;
  var sc = document.createElement("div"); sc.className = "school"; sc.textContent = S.school;
  txt.appendChild(t); txt.appendChild(rule); txt.appendChild(sc);

  sign.appendChild(num); sign.appendChild(txt);

  if (S.logo){
    var img = document.createElement("img");
    img.className = "logo"; img.src = S.logo; img.alt = "";
    img.style.height = S.logoH + "mm";
    img.style.top = ((105 - S.logoH) / 2) + "mm";
    sign.appendChild(img);
  }
  return {sign: sign, t: t, num: num, numIn: numIn, txt: txt};
}

/* підгін кегля: назва до двох рядків, номер — у ширину блоку */
function fitAll(pairs){
  pairs.forEach(function(p){
    var fs = 11;
    p.t.style.fontSize = fs + "mm";
    while (fs > 4.5 && p.t.scrollHeight > fs * 1.18 * MM * 2 + 1){
      fs -= 0.25; p.t.style.fontSize = fs + "mm";
    }
    var ns = parseFloat(p.num.style.fontSize);
    while (ns > 8 && p.numIn.offsetWidth > (S.panelW - 18) * MM){
      ns -= 1; p.num.style.fontSize = ns + "mm";
    }
    var sc = 3;
    while (sc > 2 && p.txt.lastChild.scrollWidth > p.txt.clientWidth){
      sc -= 0.1; p.txt.lastChild.style.fontSize = sc + "mm";
    }
    p.txt.style.top = ((105 * MM - p.txt.offsetHeight) / 2) + "px";
  });
}

function render(){
  const sheets = $("sheets");
  sheets.innerHTML = "";
  const pairs = [];

  if (S.mode === "single"){
    S.rooms.forEach(r => { const p = makeSign(r); pairs.push(p); sheets.appendChild(p.sign); });
  } else {
    for (let i = 0; i < S.rooms.length; i += 2){
      const a4 = document.createElement("div"); a4.className = "a4";
      S.rooms.slice(i, i+2).forEach((r, j) => {
        const p = makeSign(r); pairs.push(p);
        const slot = document.createElement("div"); slot.className = "slot";
        var tr = "translateX(" + ((j+1)*105) + "mm) rotate(90deg)";
        slot.style.webkitTransform = tr; slot.style.transform = tr;
        slot.appendChild(p.sign);
        a4.appendChild(slot);
      });
      if (S.rooms.length - i > 1){
        const cut = document.createElement("div"); cut.className = "cut";
        cut.style.left = "105mm"; a4.appendChild(cut);
      }
      sheets.appendChild(a4);
    }
  }
  fitAll(pairs);
  zoom();
}

function zoom(){
  const sheets = $("sheets");
  const wrap = sheets.parentElement;
  const avail = wrap.clientWidth;
  const natural = (S.mode === "single" ? 297 : 210) * MM;
  const k = Math.min(1, avail / natural);
  sheets.style.transform = `scale(${k})`;
  wrap.style.height = sheets.scrollHeight * k + "px";
}

/* ---- прив'язка керування ---- */
function bind(){
  $("school").value = S.school;
  $("school").oninput = e => { S.school = e.target.value; render(); save(); };

  $("logoBtn").onclick = () => $("logoFile").click();
  $("logoFile").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const fr = new FileReader();
    fr.onload = () => { S.logo = fr.result; render(); save(); };
    fr.readAsDataURL(f);
  };
  $("logoOff").onclick = () => { S.logo = ""; render(); save(); };

  $("logoH").value = S.logoH;
  $("logoHv").textContent = S.logoH;
  $("logoH").oninput = e => {
    S.logoH = +e.target.value; $("logoHv").textContent = S.logoH; render(); save();
  };

  $("panelW").value = S.panelW;
  $("panelWv").textContent = S.panelW;
  $("panelW").oninput = e => {
    S.panelW = +e.target.value; $("panelWv").textContent = S.panelW; render(); save();
  };

  $("add").onclick = () => {
    S.rooms.push(["", "Новий кабінет", S.cats[0].id]);
    buildRows(); render(); save();
    const inputs = $("rows").querySelectorAll(".row input");
    if (inputs.length) inputs[inputs.length - 2].focus();
  };

  const setMode = m => {
    S.mode = m;
    $("m1").setAttribute("aria-pressed", m === "single");
    $("m2").setAttribute("aria-pressed", m === "a4");
    $("pagecss").textContent = m === "single"
      ? "@page{size:297mm 105mm;margin:0}"
      : "@page{size:A4;margin:0}";
    $("modeHint").textContent = m === "single"
      ? "Сторінка 297 × 105 мм. Потрібен друк без полів або друкарня."
      : "Дві таблички на аркуш A4, пунктир — лінія різу. Теж потрібен друк без полів.";
    render(); save();
  };
  $("m1").onclick = () => setMode("single");
  $("m2").onclick = () => setMode("a4");
  setMode(S.mode);

  $("print").onclick = () => window.print();
  $("reset").onclick = () => {
    if (!confirm("Повернути початковий список кабінетів?")) return;
    const logo = S.logo;
    S = JSON.parse(JSON.stringify(DEFAULT)); S.logo = logo;
    buildRows(); buildCats(); bindValues(); render(); save();
  };
}

function bindValues(){
  $("school").value = S.school;
  $("logoH").value = S.logoH; $("logoHv").textContent = S.logoH;
  $("panelW").value = S.panelW; $("panelWv").textContent = S.panelW;
}

window.addEventListener("resize", zoom);

function boot(){ buildRows(); buildCats(); bind(); render(); }

(function start(){
  try {
    var raw = localStorage.getItem("door-signs");
    if (raw) S = Object.assign(JSON.parse(JSON.stringify(DEFAULT)), JSON.parse(raw));
  } catch(e){}
  boot();
})();
</script>
</body>
</html>
